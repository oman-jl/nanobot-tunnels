worker_processes 1;
error_log /demo/nginx_error.log;
pid /demo/nginx.pid;
events { worker_connections 512; }
http {
    access_log /demo/nginx_access.log;
    server {
        listen 8088;
        auth_basic "Orgo Web UI - restricted";
        auth_basic_user_file /demo/.htpasswd;

        location /demo/ {
            proxy_pass http://127.0.0.1:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /orgo/ {
            proxy_pass https://www.orgo.ai/;
            proxy_set_header Host www.orgo.ai;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_server_name on;
            proxy_redirect https://www.orgo.ai/ /orgo/;
            proxy_buffering off;
        }
        location / {
            proxy_pass http://127.0.0.1:6080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
