worker_processes 1;
error_log /demo/nginx_orgo_error.log;
pid /demo/nginx_orgo.pid;
events { worker_connections 512; }
http {
    access_log /demo/nginx_orgo_access.log;
    server {
        listen 8089;
        auth_basic "Orgo - restricted";
        auth_basic_user_file /demo/.htpasswd;

        location / {
            proxy_pass https://www.orgo.ai/;
            proxy_set_header Host www.orgo.ai;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_ssl_server_name on;
            proxy_redirect https://www.orgo.ai/ /;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }
    }
}
