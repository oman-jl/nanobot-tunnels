user root;
worker_processes 1;
error_log /demo/nginx_appubot_error.log;
pid /demo/nginx_appubot.pid;
events { worker_connections 512; }
http {
    access_log /demo/nginx_appubot_access.log;
    server {
        listen 127.0.0.1:8090;
        absolute_redirect off;

        # Auth removed per request (public no-auth access). Credentials backed up
        # at /demo/.htpasswd_appubot.bak for easy restore.

        # Root → AppuBot noVNC UI, auto-connecting with the VNC password baked in
        # (so no "Remote Desktop Password" prompt appears).
        # NOTE: VNC_PASS is set by the owner at deploy time (replace ${VNC_PASS}).
        location = / {
            return 302 /vnc.html?autoconnect=true&password=${VNC_PASS}&path=websockify;
        }

        # AppuBot desktop UI (noVNC + websocket)
        location / {
            proxy_pass http://127.0.0.1:6081;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
